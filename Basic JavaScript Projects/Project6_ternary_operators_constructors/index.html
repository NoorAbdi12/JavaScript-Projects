<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JavaScript Ternary Operators and Constructors</title>
</head>
<body>

    <h1>JavaScript Ternary Operators and Constructors</h1>

    <h2>Ternary Operator</h2>
    <p>Enter your age:</p>
    <input id="Age" type="number">
    <button onclick="check_Age()">Check Age</button>
    <p id="Age_Result"></p>

    <h2>Constructor Function</h2>
    <button onclick="display_Person()">Show Person</button>
    <p id="Person_Result"></p>

    <h2>Nested Function</h2>
    <button onclick="nested_Function()">Click Here</button>
    <p id="Nested_Result"></p>

    <script src="JS/main.js"></script>

</body>
</html>
