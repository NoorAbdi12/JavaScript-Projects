<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JavaScript Comparisons and Type Coercion</title>
</head>
<body>

    <h1>JavaScript Comparisons and Type Coercion</h1>

    <h2>Data Types and Type Coercion</h2>
    <div id="Data_Types"></div>

    <h2>Comparison Operators</h2>

    <p id="Equal" onclick="equal_Function()">
        Click to test ==
    </p>

    <p id="Strict_Equal" onclick="strict_Equal_Function()">
        Click to test ===
    </p>

    <p id="Greater" onclick="greater_Function()">
        Click to test >
    </p>

    <p id="Less" onclick="less_Function()">
        Click to test &lt;
    </p>

    <h2>Logical Operators</h2>

    <p id="And" onclick="and_Function()">
        Click to test AND
    </p>

    <p id="Or" onclick="or_Function()">
        Click to test OR
    </p>

    <p id="Not" onclick="not_Function()">
        Click to test NOT
    </p>

    <script src="JS/main.js"></script>

</body>
</html>
